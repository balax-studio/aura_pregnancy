name: aura_pregnancy
description: "Aura Pregnancy - Romantik Anı Günlüğü ve Medikal Takip Uygulaması"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  sqflite: ^2.4.1
  path: ^1.8.3
  intl: ^0.20.3
  google_fonts: ^6.1.0
  sqflite_common_ffi: ^2.3.4
  image_picker: ^1.1.2
  record: ^7.1.1
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  app_tracking_transparency: ^2.0.6
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/translations/
